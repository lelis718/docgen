plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def keystoreValue = { String key, String env, String fallback ->
    System.getenv(env) ?: keystoreProps.getProperty(key, fallback)
}

android {
    namespace 'br.com.lelis718.docgen'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.lelis718.docgen'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreValue('storeFile', 'DOCGEN_KEYSTORE', 'upload-keystore.jks'))
                storePassword keystoreValue('storePassword', 'DOCGEN_STOREPASS', null)
                keyAlias keystoreValue('keyAlias', 'DOCGEN_KEYALIAS', 'upload')
                keyPassword keystoreValue('keyPassword', 'DOCGEN_KEYPASS', null)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
